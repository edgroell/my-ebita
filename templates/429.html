{% extends "base.html" %}

{% block title %}Too many requests - My EBITA{% endblock title %}

{% block content %}
<section class="mx-auto my-8 max-w-xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm sm:my-16 sm:p-10">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-50 text-amber-700">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v3.75m9.303 3.376L13.303 3.44a1.5 1.5 0 00-2.606 0L2.697 16.126A1.5 1.5 0 003.999 18.5h16.002a1.5 1.5 0 001.302-2.374zM12 16.5h.008v.008H12V16.5z" />
        </svg>
    </div>
    <p class="mt-5 text-sm font-semibold uppercase tracking-widest text-amber-700">Request limit reached</p>
    <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Please try again shortly.</h1>
    <p class="mt-3 text-sm leading-6 text-slate-600">You’ve made requests a little too quickly. Wait a bit before trying again.</p>
    <a href="{{ url_for('index') }}"
       class="mt-6 inline-flex items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
        Return to home
    </a>
</section>
{% endblock content %}
